name: Build updated LOS Admin Panel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install pyinstaller keyboard
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name LOS_Admin_Panel --add-data "config.json;." los_overlay.py
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest dist/LOS_Admin_Panel.exe config.json --title "LOS Admin Panel (latest)" --notes "Updated build with Auto Broadcast (every 5 seconds) and Anti-AFK controls." --latest